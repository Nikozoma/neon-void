<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Neon Void</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="topleft">
      <div class="barlabel">HULL</div>
      <div id="hpbar"><div id="hpfill"></div><span id="hptext"></span></div>
      <div id="xpbar"><div id="xpfill"></div></div>
      <div id="lvltext">LV 1</div>
    </div>
    <div id="topcenter">
      <div id="timer">0:00</div>
      <div id="score">0</div>
      <div id="bossbar" class="hidden"><div id="bossfill"></div><span>WARDEN</span></div>
    </div>
    <div id="topright">
      <button id="mutebtn" class="iconbtn" aria-label="mute">♪</button>
      <button id="pausebtn" class="iconbtn" aria-label="pause">❚❚</button>
    </div>
  </div>

  <!-- Main menu -->
  <div id="menu" class="overlay">
    <div class="panel">
      <h1>NEON&nbsp;VOID</h1>
      <p class="tag">twin-stick arena survival</p>
      <div class="howto">
        <div><span class="k">◀ left thumb</span> move</div>
        <div><span class="k">▶ right thumb</span> aim + fire</div>
        <div><span class="k">◉ dash</span> burst of speed + brief invulnerability</div>
      </div>
      <button id="startbtn" class="bigbtn">ENTER THE VOID</button>
      <p id="bestline" class="best"></p>
    </div>
  </div>

  <!-- Level up -->
  <div id="levelup" class="overlay hidden">
    <div class="panel">
      <h2>SYSTEM UPGRADE</h2>
      <p class="tag">choose one</p>
      <div id="cards"></div>
    </div>
  </div>

  <!-- Pause -->
  <div id="paused" class="overlay hidden">
    <div class="panel">
      <h2>PAUSED</h2>
      <button id="resumebtn" class="bigbtn">RESUME</button>
      <button id="quitbtn" class="ghostbtn">ABANDON RUN</button>
    </div>
  </div>

  <!-- Game over -->
  <div id="gameover" class="overlay hidden">
    <div class="panel">
      <h2 class="red">SIGNAL LOST</h2>
      <div id="stats"></div>
      <p id="newbest" class="best hidden">★ NEW BEST ★</p>
      <button id="retrybtn" class="bigbtn">RETRY</button>
      <button id="menubtn" class="ghostbtn">MAIN MENU</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <div id="warnbanner" class="hidden">⚠ WARDEN APPROACHING ⚠</div>
</div>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
